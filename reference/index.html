<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --ink:#161616;
    --muted:#5f5f5f;
    --rule:#e4e4e4;
    --sun:#f7c600;
    --sun-press:#e0b300;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141414;
      --ink:#f2f2f2;
      --muted:#a3a3a3;
      --rule:#2a2a2a;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    line-height:1.45;
  }
  .card{
    width:100%;
    max-width:400px;
  }
  .logo{
    display:block;
    height:96px;
    width:auto;
    max-width:100%;
    margin-bottom:36px;
  }
  .name{
    font-size:clamp(2.25rem,9vw,3rem);
    font-weight:700;
    letter-spacing:-0.03em;
    line-height:1;
  }
  .name::after{
    content:"";
    display:inline-block;
    width:0.28em;
    height:0.28em;
    margin-left:0.12em;
    background:var(--sun);
    vertical-align:baseline;
  }
  .role{
    margin-top:14px;
    font-size:1.0625rem;
    font-weight:500;
  }
  .org{
    color:var(--muted);
    font-size:1.0625rem;
  }
  .tagline{
    margin-top:0;
    color:var(--muted);
    font-size:0.9375rem;
    font-style:italic;
  }
  .save{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    margin-top:36px;
    padding:16px 20px;
    background:var(--sun);
    color:#161616;
    font:inherit;
    font-size:1.0625rem;
    font-weight:700;
    text-decoration:none;
    border:0;
    border-radius:8px;
    cursor:pointer;
  }
  .save:active{background:var(--sun-press)}
  .save svg{width:20px;height:20px;flex:none}
  .contacts{
    list-style:none;
    margin-top:32px;
    border-top:1px solid var(--rule);
  }
  .contacts li{border-bottom:1px solid var(--rule)}
  .contacts a{
    display:grid;
    grid-template-columns:22px 1fr;
    gap:14px;
    align-items:start;
    padding:16px 4px;
    color:inherit;
    text-decoration:none;
    font-size:1rem;
  }
  .contacts svg{
    width:20px;height:20px;
    margin-top:2px;
    color:var(--muted);
  }
  .contacts .label{
    display:block;
    color:var(--muted);
    font-size:0.8125rem;
    margin-top:2px;
  }
  .save:focus-visible,.contacts a:focus-visible{
    outline:3px solid var(--sun);
    outline-offset:3px;
    border-radius:6px;
  }
  @media (hover:hover){
    .save:hover{background:var(--sun-press)}
    .contacts a:hover{color:var(--muted)}
  }
</style>
</head>
